<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hot Zone VIP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A; --bg-raised:#171D26; --line:#2A323D;
    --gold:#E3A23C; --gold-dim:#8C6A2E;
    --win:#3FA96A; --loss:#D65A5A; --void:#8B95A3; --pending:#5E6A79;
    --text:#EDEFF2; --text-dim:#939CA8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 100px;
        padding-top:env(safe-area-inset-top);
        padding-bottom:calc(100px + env(safe-area-inset-bottom));}
  .topbar{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;}
  .mark{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;letter-spacing:0.5px;}
  .brand span{color:var(--gold);}
  .sub{font-size:12px;color:var(--text-dim);margin-top:1px;}
  .hero{margin:6px 20px 22px;background:var(--bg-raised);border:1px solid var(--line);border-radius:14px;padding:26px 22px 20px;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .hero-label{font-size:12.5px;color:var(--text-dim);}
  .hero-number{font-family:'Oswald',sans-serif;font-weight:600;font-size:56px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
  .hero-number.neg{color:var(--loss);} .hero-number.pos{color:var(--win);} .hero-number.flat{color:var(--text-dim);}
  .hero-sub{font-size:13.5px;color:var(--text-dim);margin-bottom:18px;}
  .record{display:flex;border-top:1px solid var(--line);padding-top:16px;}
  .record-item{flex:1;text-align:left;}
  .record-item + .record-item{border-left:1px solid var(--line);padding-left:16px;margin-left:16px;}
  .record-num{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
  .record-num.win{color:var(--win);} .record-num.loss{color:var(--loss);} .record-num.void{color:var(--void);} .record-num.pending{color:var(--pending);}
  .record-lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .meta-row{display:flex;justify-content:space-between;margin:14px 20px 8px;font-size:12px;color:var(--text-dim);}
  .section-title{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.3px;color:var(--text);margin:22px 20px 10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .ticket{margin:0 20px 12px;background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
  .ticket-date{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:0.3px;}
  .ticket-league{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .badge{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;border:none;cursor:pointer;}
  .badge.Win{background:rgba(63,169,106,0.15);color:var(--win);}
  .badge.Loss{background:rgba(214,90,90,0.15);color:var(--loss);}
  .badge.Void{background:rgba(139,149,163,0.15);color:var(--void);}
  .badge.Pending{background:rgba(94,106,121,0.15);color:var(--pending);}
  .ticket-match{font-size:14.5px;font-weight:500;margin:4px 0 2px;}
  .ticket-market{font-size:12.5px;color:var(--text-dim);line-height:1.4;}
  .ticket-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .odds{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;}
  .stake{font-size:12px;color:var(--text-dim);}
  .empty{margin:0 20px;background:var(--bg-raised);border:1px dashed var(--line);border-radius:10px;padding:32px 20px;text-align:center;}
  .empty-icon{font-size:26px;margin-bottom:10px;}
  .empty-title{font-size:14.5px;font-weight:500;margin-bottom:4px;}
  .empty-sub{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .footer{margin:26px 20px 0;font-size:11.5px;color:var(--text-dim);text-align:center;line-height:1.6;}

  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
       background:linear-gradient(145deg,var(--gold),var(--gold-dim));border:none;box-shadow:0 6px 18px rgba(0,0,0,0.4);
       font-size:26px;color:#10141A;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .fab:active{transform:scale(0.94);}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;z-index:20;}
  .sheet-backdrop.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-raised);border-top:1px solid var(--line);
         border-radius:16px 16px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));z-index:21;
         transform:translateY(100%);transition:transform .22s ease;max-height:85vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheet h3{font-family:'Oswald',sans-serif;font-size:17px;margin:2px 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
       padding:10px 12px;color:var(--text);font-size:14px;font-family:'Work Sans',sans-serif;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;padding:12px;border-radius:9px;border:none;font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--gold);color:#10141A;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .pin-box{margin-bottom:14px;}
  .status{font-size:12px;color:var(--text-dim);text-align:center;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark">⚽</div>
    <div>
      <div class="brand">HOT <span>ZONE</span> VIP</div>
      <div class="sub" id="subLabel">Loading…</div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-label">Net result</div>
    <div class="hero-number flat" id="netUnits">0.00U</div>
    <div class="hero-sub" id="netSub">No bets settled yet</div>
    <div class="record">
      <div class="record-item"><div class="record-num win" id="cWin">0</div><div class="record-lbl">Wins</div></div>
      <div class="record-item"><div class="record-num loss" id="cLoss">0</div><div class="record-lbl">Losses</div></div>
      <div class="record-item"><div class="record-num void" id="cVoid">0</div><div class="record-lbl">Void</div></div>
      <div class="record-item"><div class="record-num pending" id="cPending">0</div><div class="record-lbl">Pending</div></div>
    </div>
  </div>

  <div class="meta-row"><span>Unit = 100€</span><span id="updatedLabel">—</span></div>
  <div class="section-title">Bet log</div>
  <div id="ticketList"></div>
</div>

<button class="fab" id="fabAdd">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h3>Add a bet</h3>
  <div class="pin-box">
    <div class="field"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="••••"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>Date</label><input id="f_date" type="date"></div>
    <div class="field"><label>Odds</label><input id="f_odds" type="number" step="0.01" placeholder="2.10"></div>
  </div>
  <div class="field"><label>League</label><input id="f_league" type="text" placeholder="England Premier League"></div>
  <div class="field"><label>Match</label><input id="f_match" type="text" placeholder="Arsenal vs Everton"></div>
  <div class="field"><label>Market</label><input id="f_market" type="text" placeholder="Total Over (10.5) Corners"></div>
  <div class="field-row">
    <div class="field"><label>Unit stake (€)</label><input id="f_stake" type="number" value="100"></div>
    <div class="field"><label>Result</label>
      <select id="f_result">
        <option value="Pending">Pending</option>
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Void">Void</option>
      </select>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    <button class="btn btn-primary" id="saveBtn">Save bet</button>
  </div>
  <div class="status" id="formStatus"></div>
</div>

<script>
/* ====== FILL THESE IN AFTER YOU CREATE YOUR SUPABASE PROJECT ====== */
const SUPABASE_URL = "https://gpjptcijunflcaacnklt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ehr2wgNQHzxkPMiRfEkB1w_cxPMgAkP";
const ADMIN_PIN = "6969"; // change this to your own PIN
/* ==================================================================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#10141A'); } catch(e){}
  try { tg.setBackgroundColor('#10141A'); } catch(e){}
}

const listEl = document.getElementById('ticketList');
const fab = document.getElementById('fabAdd');
const backdrop = document.getElementById('backdrop');
const sheet = document.getElementById('sheet');
const cancelBtn = document.getElementById('cancelBtn');
const saveBtn = document.getElementById('saveBtn');
const formStatus = document.getElementById('formStatus');

function openSheet(){ backdrop.classList.add('open'); sheet.classList.add('open'); formStatus.textContent=''; }
function closeSheet(){ backdrop.classList.remove('open'); sheet.classList.remove('open'); }
fab.onclick = openSheet;
cancelBtn.onclick = closeSheet;
backdrop.onclick = closeSheet;

async function loadBets(){
  const { data, error } = await sb.from('bets').select('*').order('date', { ascending: false }).order('created_at', { ascending: false });
  if (error) { document.getElementById('subLabel').textContent = 'Failed to load — check Supabase config'; return; }
  render(data || []);
}

function render(bets){
  document.getElementById('subLabel').textContent = 'September bet log & results';
  const win = bets.filter(b => b.result === 'Win');
  const loss = bets.filter(b => b.result === 'Loss');
  const voidB = bets.filter(b => b.result === 'Void');
  const pending = bets.filter(b => b.result === 'Pending');

  document.getElementById('cWin').textContent = win.length;
  document.getElementById('cLoss').textContent = loss.length;
  document.getElementById('cVoid').textContent = voidB.length;
  document.getElementById('cPending').textContent = pending.length;

  const netUnits = win.reduce((s,b)=>s+(Number(b.odds)-1),0) - loss.length;
  const netEur = win.reduce((s,b)=>s+Number(b.unit_stake)*(Number(b.odds)-1),0) - loss.reduce((s,b)=>s+Number(b.unit_stake),0);
  const settled = win.length + loss.length;
  const winRate = settled ? (win.length/settled*100).toFixed(1) : '0.0';

  const netEl = document.getElementById('netUnits');
  netEl.textContent = (netUnits>=0?'+':'') + netUnits.toFixed(2) + 'U';
  netEl.className = 'hero-number ' + (netUnits>0?'pos':netUnits<0?'neg':'flat');
  document.getElementById('netSub').textContent = settled
    ? `${(netEur>=0?'+':'')}${netEur.toFixed(0)}€ on settled bets · ${winRate}% win rate`
    : 'No bets settled yet';

  document.getElementById('updatedLabel').textContent = bets.length ? 'Updated ' + new Date().toLocaleDateString() : '—';

  if (!bets.length){
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">🗓️</div>
      <div class="empty-title">Nothing logged yet</div>
      <div class="empty-sub">Tap the + button to add today's first bet.</div></div>`;
    return;
  }

  listEl.innerHTML = bets.map(b => `
    <div class="ticket">
      <div class="ticket-top">
        <div><div class="ticket-date">${fmtDate(b.date)}</div><div class="ticket-league">${escapeHtml(b.league||'')}</div></div>
        <button class="badge ${b.result}" data-id="${b.id}" data-cur="${b.result}">${b.result}</button>
      </div>
      <div class="ticket-match">${escapeHtml(b.match||'')}</div>
      <div class="ticket-market">${escapeHtml(b.market||'')}</div>
      <div class="ticket-bottom">
        <div class="odds">${Number(b.odds).toFixed(2)}</div>
        <div class="stake">${Number(b.unit_stake)}€ stake</div>
      </div>
    </div>`).join('');

  document.querySelectorAll('.badge').forEach(btn=>{
    btn.onclick = () => cycleResult(btn.dataset.id, btn.dataset.cur);
  });
}

function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ORDER = ['Pending','Win','Loss','Void'];
async function cycleResult(id, cur){
  const pin = prompt('Admin PIN to change result:');
  if (pin !== ADMIN_PIN) { alert('Wrong PIN'); return; }
  const next = ORDER[(ORDER.indexOf(cur)+1) % ORDER.length];
  const { error } = await sb.from('bets').update({ result: next }).eq('id', id);
  if (error) { alert('Failed to update'); return; }
  loadBets();
}

saveBtn.onclick = async () => {
  const pin = document.getElementById('pin').value;
  if (pin !== ADMIN_PIN) { formStatus.textContent = 'Wrong PIN'; return; }
  const row = {
    date: document.getElementById('f_date').value,
    league: document.getElementById('f_league').value,
    match: document.getElementById('f_match').value,
    market: document.getElementById('f_market').value,
    odds: parseFloat(document.getElementById('f_odds').value),
    unit_stake: parseFloat(document.getElementById('f_stake').value) || 100,
    result: document.getElementById('f_result').value
  };
  if (!row.date || !row.match || !row.odds){ formStatus.textContent = 'Fill in date, match and odds'; return; }
  formStatus.textContent = 'Saving…';
  const { error } = await sb.from('bets').insert([row]);
  if (error) { formStatus.textContent = 'Save failed'; return; }
  closeSheet();
  loadBets();
};

loadBets();
</script>
</body>
</html>
