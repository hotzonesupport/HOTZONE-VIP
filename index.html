<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hot Zone VIP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E13; --bg-raised:#161C26; --line:#293040;
    --gold:#3D6FE0; --gold-dim:#16264F;
    --win:#3FA96A; --loss:#D65A5A; --void:#8B95A3; --pending:#5E6A79;
    --text:#EDEFF2; --text-dim:#8D97A6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;color-scheme:dark;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(61,111,224,0.10), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(61,111,224,0.06), transparent 40%),
      var(--bg);
    min-height:100vh;
  }

  .container{max-width:520px;margin:0 auto;width:100%;padding-left:20px;padding-right:20px;}
  @media (min-width:760px){ .container{max-width:980px;padding-left:32px;padding-right:32px;} }
  @media (min-width:1200px){ .container{max-width:1240px;padding-left:40px;padding-right:40px;} }

  /* ---- top bar : sits in normal flow at the top of the page, scrolls away with content ---- */
  .topbar-outer{
    position:static;width:100%;
    padding-top:env(safe-area-inset-top);
    background:rgba(11,14,19,0.86);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px;}
  .mark{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold-dim));
        display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;
        box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 4px 14px rgba(61,111,224,0.25);}
  .mark img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;letter-spacing:0.3px;line-height:1.1;}
  .brand span{color:var(--text);}
  .sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;display:flex;align-items:center;gap:6px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--win);display:inline-block;flex-shrink:0;}

  .page{padding-bottom:100px;padding-bottom:calc(100px + env(safe-area-inset-bottom));}
  .content{padding-top:20px;}

  .period-select{margin:0 0 16px;}
  .period-select select{width:100%;max-width:340px;background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;
        padding:11px 12px;color:var(--text);font-family:'Oswald',sans-serif;font-size:14px;font-weight:500;
        -webkit-appearance:none;appearance:none;}

  .dash-row{display:block;margin-bottom:16px;}

  .hero{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:28px 26px 22px;position:relative;overflow:hidden;margin-bottom:16px;}
  .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .hero-label{font-size:13px;color:var(--text-dim);}
  .hero-number{font-family:'Oswald',sans-serif;font-weight:600;font-size:58px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
  .hero-number.neg{color:var(--loss);} .hero-number.pos{color:var(--win);} .hero-number.flat{color:var(--text-dim);}
  .hero-sub{font-size:14px;color:var(--text-dim);margin-bottom:20px;}

  .streak{text-align:right;flex-shrink:0;margin-left:12px;}
  .streak-badge{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;padding:4px 0;}
  .streak-badge.win{color:var(--win);} .streak-badge.loss{color:var(--loss);} .streak-badge.flat{color:var(--text-dim);}
  .streak-lbl{font-size:11px;color:var(--text-dim);margin-top:1px;}

  .record{display:flex;border-top:1px solid var(--line);padding-top:18px;}
  .record-item{flex:1;text-align:left;}
  .record-item + .record-item{border-left:1px solid var(--line);padding-left:18px;margin-left:18px;}
  .record-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;}
  .record-num.win{color:var(--win);} .record-num.loss{color:var(--loss);} .record-num.void{color:var(--void);} .record-num.pending{color:var(--pending);}
  .record-lbl{font-size:12px;color:var(--text-dim);margin-top:2px;}

  .chart-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;margin-bottom:16px;}
  .chart-title{font-family:'Oswald',sans-serif;font-size:13.5px;color:var(--text-dim);margin-bottom:8px;}
  .chart-empty{font-size:13px;color:var(--text-dim);text-align:center;padding:34px 0;}
  svg.chart{width:100%;height:120px;display:block;}

  .meta-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);}

  .filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:20px;
        border:1px solid var(--line);background:var(--bg-raised);color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--gold);border-color:var(--gold);color:#F4F7FF;}
  .filter-label{font-size:11.5px;color:var(--text-dim);margin:0 0 6px;font-family:'Oswald',sans-serif;letter-spacing:0.2px;}
  .league-select{margin-bottom:6px;}
  .league-select select{width:100%;max-width:300px;background:var(--bg-raised);border:1px solid var(--line);border-radius:9px;
        padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'Work Sans',sans-serif;}

  .section-title{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.3px;color:var(--text);margin:20px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  #ticketList{padding:0;}
  .ticket{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:8px;}
  .ticket-date{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:0.3px;}
  .ticket-league{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .badge{font-family:'Oswald',sans-serif;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;border:none;cursor:pointer;}
  .badge.Win{background:rgba(63,169,106,0.15);color:var(--win);}
  .badge.Loss{background:rgba(214,90,90,0.15);color:var(--loss);}
  .badge.Void{background:rgba(139,149,163,0.15);color:var(--void);}
  .badge.Pending{background:rgba(94,106,121,0.15);color:var(--pending);}
  .ticket-match{font-size:15.5px;font-weight:500;margin:5px 0 3px;}
  .ticket-market{font-size:13px;color:var(--text-dim);line-height:1.4;}
  .ticket-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .odds{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;}
  .stake{font-size:12.5px;color:var(--text-dim);}
  .empty{background:var(--bg-raised);border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;}
  .empty-icon{font-size:28px;margin-bottom:10px;}
  .empty-title{font-size:15px;font-weight:500;margin-bottom:4px;}
  .empty-sub{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .footer{margin-top:28px;font-size:12px;color:var(--text-dim);text-align:center;line-height:1.6;}

  .fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
       background:linear-gradient(145deg,var(--gold),var(--gold-dim));border:none;box-shadow:0 6px 18px rgba(0,0,0,0.5);
       font-size:26px;color:#F4F7FF;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;}
  .fab:active{transform:scale(0.94);}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;z-index:40;}
  .sheet-backdrop.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg-raised);border-top:1px solid var(--line);
         border-radius:16px 16px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));z-index:41;
         transform:translateY(100%);transition:transform .22s ease;max-height:85vh;overflow-y:auto;
         max-width:480px;margin:0 auto;}
  .sheet.open{transform:translateY(0);}
  .sheet h3{font-family:'Oswald',sans-serif;font-size:17px;margin:2px 0 14px;}
  .field{margin-bottom:12px;min-width:0;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .field input,.field select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;
       padding:0 12px;height:42px;color:var(--text);font-size:16px;font-family:'Work Sans',sans-serif;
       -webkit-appearance:none;appearance:none;}
  .field input[type="date"]{color-scheme:dark;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1 1 0;width:0;}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;padding:12px;border-radius:9px;border:none;font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--gold);color:#F4F7FF;}
  .btn-secondary{background:transparent;border:1px solid var(--line);color:var(--text-dim);}
  .status{font-size:12px;color:var(--text-dim);text-align:center;margin-top:10px;min-height:16px;}

  /* ---- desktop / wide viewport ---- */
  @media (min-width: 760px){
    .mark{width:58px;height:58px;font-size:24px;}
    .brand{font-size:24px;}
    .sub{font-size:12.5px;}
    .content{padding-top:28px;}
    .dash-row{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:stretch;}
    .dash-row .hero,.dash-row .chart-card{margin-bottom:0;}
    .hero{padding:34px 32px 26px;}
    .hero-number{font-size:68px;}
    .hero-label{font-size:14px;}
    .hero-sub{font-size:15px;}
    .record-num{font-size:29px;}
    .chart-card{padding:26px 26px 20px;display:flex;flex-direction:column;}
    svg.chart{height:150px;flex:1;}
    .section-title{font-size:16px;}
    #ticketList{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:16px;}
    .ticket{margin-bottom:0;padding:18px 20px;}
    .ticket-match{font-size:16.5px;}
  }
  @media (min-width: 1200px){
    .hero-number{font-size:76px;}
    #ticketList{grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));}
  }
</style>
</head>
<body>
<div class="topbar-outer">
  <div class="container topbar-inner">
    <div class="mark" id="logoMark">⚽</div>
    <div>
      <div class="brand">HOT <span>ZONE</span> VIP</div>
      <div class="sub"><span class="live-dot"></span><span id="subLabel">Loading…</span></div>
    </div>
  </div>
</div>

<div class="page">
  <div class="container content">
    <div class="period-select">
      <select id="periodSelect"></select>
    </div>

    <div class="dash-row">
      <div class="hero">
        <div class="hero-top">
          <div>
            <div class="hero-label">Net result</div>
            <div class="hero-number flat" id="netUnits">0.00U</div>
            <div class="hero-sub" id="netSub">No bets settled yet</div>
          </div>
          <div class="streak">
            <div class="streak-badge flat" id="streakBadge">—</div>
            <div class="streak-lbl">Current streak</div>
          </div>
        </div>
        <div class="record">
          <div class="record-item"><div class="record-num win" id="cWin">0</div><div class="record-lbl">Wins</div></div>
          <div class="record-item"><div class="record-num loss" id="cLoss">0</div><div class="record-lbl">Losses</div></div>
          <div class="record-item"><div class="record-num void" id="cVoid">0</div><div class="record-lbl">Void</div></div>
          <div class="record-item"><div class="record-num pending" id="cPending">0</div><div class="record-lbl">Pending</div></div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Units over time</div>
        <div id="chartWrap"><div class="chart-empty">Chart appears once bets are settled</div></div>
      </div>
    </div>

    <div class="meta-row"><span>Unit = 100€</span><span id="updatedLabel">—</span></div>

    <div class="filters" id="resultFilters">
      <button class="chip active" data-filter="All">All</button>
      <button class="chip" data-filter="Win">Win</button>
      <button class="chip" data-filter="Loss">Loss</button>
      <button class="chip" data-filter="Void">Void</button>
      <button class="chip" data-filter="Pending">Pending</button>
    </div>

    <div class="filter-label">Bet type</div>
    <div class="filters" id="marketFilters">
      <button class="chip active" data-filter="All">All</button>
      <button class="chip" data-filter="1H Goals">1st Half Goals</button>
      <button class="chip" data-filter="1H Corners">1st Half Corners</button>
      <button class="chip" data-filter="FT Goals">Full Match Goals</button>
      <button class="chip" data-filter="FT Corners">Full Match Corners</button>
      <button class="chip" data-filter="Other">Other</button>
    </div>

    <div class="league-select">
      <select id="leagueFilter"><option value="All">All leagues</option></select>
    </div>

    <div class="section-title">Bet log</div>
    <div id="ticketList"></div>
  </div>
</div>

<button class="fab" id="fabAdd">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h3>Add a bet</h3>
  <div class="field"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="••••"></div>
  <div class="field-row">
    <div class="field"><label>Date</label><input id="f_date" type="date"></div>
    <div class="field"><label>Odds</label><input id="f_odds" type="text" inputmode="decimal" placeholder="2.10 or 2,10"></div>
  </div>
  <div class="field"><label>League</label><input id="f_league" type="text" placeholder="England Premier League"></div>
  <div class="field"><label>Match</label><input id="f_match" type="text" placeholder="Arsenal vs Everton"></div>
  <div class="field"><label>Market</label><input id="f_market" type="text" placeholder="Total Over (10.5) Corners"></div>
  <div class="field"><label>Bet type</label>
    <select id="f_market_type">
      <option value="1H Goals">1st Half Goals</option>
      <option value="1H Corners">1st Half Corners</option>
      <option value="FT Goals">Full Match Goals</option>
      <option value="FT Corners">Full Match Corners</option>
      <option value="Other">Other</option>
    </select>
  </div>
  <div class="field-row">
    <div class="field"><label>Unit stake (€)</label><input id="f_stake" type="number" inputmode="numeric" value="100"></div>
    <div class="field"><label>Result</label>
      <select id="f_result">
        <option value="Pending">Pending</option>
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Void">Void</option>
      </select>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
    <button class="btn btn-primary" id="saveBtn">Save bet</button>
  </div>
  <div class="status" id="formStatus"></div>
</div>

<script>
/* ====== CONFIG ====== */
const SUPABASE_URL = "https://gpjptcijunflcaacnklt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ehr2wgNQHzxkPMiRfEkB1w_cxPMgAkP";
const ADMIN_PIN = "6969";
const LOGO_URL = "logo.jpg"; // upload a square image with this filename to the repo to use your own logo
/* ===================== */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0B0E13'); } catch(e){}
  try { tg.setBackgroundColor('#0B0E13'); } catch(e){}
}

(function(){
  const img = new Image();
  img.onload = () => { document.getElementById('logoMark').innerHTML = `<img src="${LOGO_URL}">`; };
  img.onerror = () => {};
  img.src = LOGO_URL;
})();

const listEl = document.getElementById('ticketList');
const fab = document.getElementById('fabAdd');
const backdrop = document.getElementById('backdrop');
const sheet = document.getElementById('sheet');
const cancelBtn = document.getElementById('cancelBtn');
const saveBtn = document.getElementById('saveBtn');
const formStatus = document.getElementById('formStatus');
const leagueFilter = document.getElementById('leagueFilter');
const periodSelect = document.getElementById('periodSelect');
const marketFiltersEl = document.getElementById('marketFilters');

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MARKET_TYPE_LABELS = {'1H Goals':'1st Half Goals','1H Corners':'1st Half Corners','FT Goals':'Full Match Goals','FT Corners':'Full Match Corners','Other':'Other'};

let allBets = [];
let activeResultFilter = 'All';
let activeMarketFilter = 'All';
let activeLeagueFilter = 'All';
let activePeriod = 'month-' + new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');

function openSheet(){ backdrop.classList.add('open'); sheet.classList.add('open'); formStatus.textContent=''; }
function closeSheet(){ backdrop.classList.remove('open'); sheet.classList.remove('open'); }
fab.onclick = openSheet;
cancelBtn.onclick = () => { resetForm(); closeSheet(); };
backdrop.onclick = closeSheet;

document.querySelectorAll('#resultFilters .chip').forEach(chip=>{
  chip.onclick = () => {
    document.querySelectorAll('#resultFilters .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeResultFilter = chip.dataset.filter;
    renderAll();
  };
});
document.querySelectorAll('#marketFilters .chip').forEach(chip=>{
  chip.onclick = () => {
    document.querySelectorAll('#marketFilters .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeMarketFilter = chip.dataset.filter;
    renderList();
  };
});
leagueFilter.onchange = () => { activeLeagueFilter = leagueFilter.value; renderList(); };
periodSelect.onchange = () => { activePeriod = periodSelect.value; renderAll(); };

async function loadBets(){
  const { data, error } = await sb.from('bets').select('*').order('date', { ascending: false }).order('created_at', { ascending: false });
  if (error) { document.getElementById('subLabel').textContent = 'Failed to load — check Supabase config'; return; }
  allBets = data || [];
  buildPeriodOptions();
  renderAll();
}

function buildPeriodOptions(){
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth()+1;
  const byYear = {};
  allBets.forEach(b=>{
    if (!b.date) return;
    const [y,m] = b.date.split('-').map(Number);
    if (!byYear[y]) byYear[y] = new Set();
    byYear[y].add(m);
  });
  if (!byYear[curY]) byYear[curY] = new Set();
  byYear[curY].add(curM);

  const years = Object.keys(byYear).map(Number).sort((a,b)=>b-a);
  let html = `<option value="all">All time</option>`;
  years.forEach(y=>{
    html += `<optgroup label="${y}">`;
    html += `<option value="year-${y}">${y} — Full Year</option>`;
    const months = [...byYear[y]].sort((a,b)=>b-a);
    months.forEach(m=>{
      const val = `month-${y}-${String(m).padStart(2,'0')}`;
      html += `<option value="${val}">${MONTH_NAMES[m-1]} ${y}</option>`;
    });
    html += `</optgroup>`;
  });
  const prev = periodSelect.value || activePeriod;
  periodSelect.innerHTML = html;
  const optionValues = [...periodSelect.options].map(o=>o.value);
  periodSelect.value = optionValues.includes(prev) ? prev : (optionValues.includes(activePeriod) ? activePeriod : 'all');
  activePeriod = periodSelect.value;
}

function periodBets(){
  if (activePeriod === 'all') return allBets;
  if (activePeriod.startsWith('year-')){
    const y = activePeriod.split('-')[1];
    return allBets.filter(b => b.date && b.date.startsWith(y + '-'));
  }
  if (activePeriod.startsWith('month-')){
    const [, y, m] = activePeriod.split('-');
    return allBets.filter(b => b.date && b.date.startsWith(y + '-' + m));
  }
  return allBets;
}

function periodLabel(){
  const opt = periodSelect.options[periodSelect.selectedIndex];
  return opt ? opt.textContent : '';
}

function renderAll(){
  document.getElementById('subLabel').textContent = periodLabel() + ' · bet log & results';
  renderSummary();
  renderChart();
  renderLeagueOptions();
  renderList();
}

function renderSummary(){
  const bets = periodBets();
  const win = bets.filter(b => b.result === 'Win');
  const loss = bets.filter(b => b.result === 'Loss');
  const voidB = bets.filter(b => b.result === 'Void');
  const pending = bets.filter(b => b.result === 'Pending');

  document.getElementById('cWin').textContent = win.length;
  document.getElementById('cLoss').textContent = loss.length;
  document.getElementById('cVoid').textContent = voidB.length;
  document.getElementById('cPending').textContent = pending.length;

  const netUnits = win.reduce((s,b)=>s+(Number(b.odds)-1),0) - loss.length;
  const netEur = win.reduce((s,b)=>s+Number(b.unit_stake)*(Number(b.odds)-1),0) - loss.reduce((s,b)=>s+Number(b.unit_stake),0);
  const settled = win.length + loss.length;
  const winRate = settled ? (win.length/settled*100).toFixed(1) : '0.0';

  const netEl = document.getElementById('netUnits');
  netEl.textContent = (netUnits>=0?'+':'') + netUnits.toFixed(2) + 'U';
  netEl.className = 'hero-number ' + (netUnits>0?'pos':netUnits<0?'neg':'flat');
  document.getElementById('netSub').textContent = settled
    ? `${(netEur>=0?'+':'')}${netEur.toFixed(0)}€ on settled bets · ${winRate}% win rate`
    : 'No bets settled yet';

  document.getElementById('updatedLabel').textContent = bets.length ? periodLabel() : '—';

  const settledDesc = bets.filter(b => b.result === 'Win' || b.result === 'Loss');
  const streakEl = document.getElementById('streakBadge');
  if (!settledDesc.length){
    streakEl.textContent = '—'; streakEl.className = 'streak-badge flat';
  } else {
    const first = settledDesc[0].result;
    let count = 0;
    for (const b of settledDesc){ if (b.result === first) count++; else break; }
    streakEl.textContent = count + (first === 'Win' ? 'W' : 'L');
    streakEl.className = 'streak-badge ' + (first === 'Win' ? 'win' : 'loss');
  }
}

function renderChart(){
  const wrap = document.getElementById('chartWrap');
  const bets = periodBets();
  const chrono = [...bets].filter(b => b.result==='Win'||b.result==='Loss'||b.result==='Void')
    .sort((a,b)=> new Date(a.date+'T00:00:00') - new Date(b.date+'T00:00:00') || new Date(a.created_at)-new Date(b.created_at));
  const settledPoints = chrono.filter(b=>b.result==='Win'||b.result==='Loss');
  if (settledPoints.length < 2){
    wrap.innerHTML = '<div class="chart-empty">Chart appears once a few bets are settled</div>';
    return;
  }
  let running = 0;
  const pts = [0];
  chrono.forEach(b=>{
    if (b.result==='Win') running += (Number(b.odds)-1);
    else if (b.result==='Loss') running -= 1;
    pts.push(running);
  });
  const w = 480, h = 100, pad = 8;
  const min = Math.min(...pts), max = Math.max(...pts);
  const range = (max-min) || 1;
  const stepX = (w - pad*2) / (pts.length - 1);
  const coords = pts.map((v,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h - pad*2) * (1 - (v-min)/range);
    return [x,y];
  });
  const zeroY = pad + (h - pad*2) * (1 - (0-min)/range);
  const linePath = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const lastVal = pts[pts.length-1];
  const lineColor = lastVal >= 0 ? '#3FA96A' : '#D65A5A';
  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="#293040" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${linePath}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderLeagueOptions(){
  const bets = periodBets();
  const leagues = [...new Set(bets.map(b=>b.league).filter(Boolean))].sort();
  const current = leagueFilter.value;
  leagueFilter.innerHTML = '<option value="All">All leagues</option>' +
    leagues.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
  activeLeagueFilter = leagues.includes(current) ? current : 'All';
  leagueFilter.value = activeLeagueFilter;
}

function renderList(){
  let bets = periodBets();
  if (activeResultFilter !== 'All') bets = bets.filter(b=>b.result===activeResultFilter);
  if (activeMarketFilter !== 'All') bets = bets.filter(b=>(b.market_type||'Other')===activeMarketFilter);
  if (activeLeagueFilter !== 'All') bets = bets.filter(b=>b.league===activeLeagueFilter);

  if (!bets.length){
    const hasAnyInPeriod = periodBets().length > 0;
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">🗓️</div>
      <div class="empty-title">${hasAnyInPeriod ? 'No bets match this filter' : 'Nothing logged yet'}</div>
      <div class="empty-sub">${hasAnyInPeriod ? 'Try a different filter above.' : "Tap the + button to add today's first bet."}</div></div>`;
    return;
  }

  listEl.innerHTML = bets.map(b => `
    <div class="ticket">
      <div class="ticket-top">
        <div><div class="ticket-date">${fmtDate(b.date)}</div><div class="ticket-league">${escapeHtml(b.league||'')}</div></div>
        <button class="badge ${b.result}" data-id="${b.id}" data-cur="${b.result}">${b.result}</button>
      </div>
      <div class="ticket-match">${escapeHtml(b.match||'')}</div>
      <div class="ticket-market">${escapeHtml(b.market||'')}${b.market_type ? ' · ' + MARKET_TYPE_LABELS[b.market_type] : ''}</div>
      <div class="ticket-bottom">
        <div class="odds">${Number(b.odds).toFixed(2)}</div>
        <div class="stake">${Number(b.unit_stake)}€ stake</div>
      </div>
    </div>`).join('');

  document.querySelectorAll('.badge').forEach(btn=>{
    btn.onclick = () => cycleResult(btn.dataset.id, btn.dataset.cur);
  });
}

function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ORDER = ['Pending','Win','Loss','Void'];
async function cycleResult(id, cur){
  const pin = prompt('Admin PIN to change result:');
  if (pin !== ADMIN_PIN) { alert('Wrong PIN'); return; }
  const next = ORDER[(ORDER.indexOf(cur)+1) % ORDER.length];
  const { error } = await sb.from('bets').update({ result: next }).eq('id', id);
  if (error) { alert('Failed to update: ' + error.message); return; }
  loadBets();
}

saveBtn.onclick = async () => {
  const pin = document.getElementById('pin').value;
  if (pin !== ADMIN_PIN) { formStatus.textContent = 'Wrong PIN'; return; }
  const row = {
    date: document.getElementById('f_date').value,
    league: document.getElementById('f_league').value,
    match: document.getElementById('f_match').value,
    market: document.getElementById('f_market').value,
    market_type: document.getElementById('f_market_type').value,
    odds: parseFloat(document.getElementById('f_odds').value.replace(',', '.')),
    unit_stake: parseFloat(document.getElementById('f_stake').value) || 100,
    result: document.getElementById('f_result').value
  };
  if (!row.date || !row.match || !row.odds){ formStatus.textContent = 'Fill in date, match and odds'; return; }
  formStatus.textContent = 'Saving…';
  const { error } = await sb.from('bets').insert([row]);
  if (error) { formStatus.textContent = 'Save failed: ' + error.message; return; }
  resetForm();
  closeSheet();
  loadBets();
};

function resetForm(){
  document.getElementById('pin').value = '';
  document.getElementById('f_date').value = '';
  document.getElementById('f_odds').value = '';
  document.getElementById('f_league').value = '';
  document.getElementById('f_match').value = '';
  document.getElementById('f_market').value = '';
  document.getElementById('f_market_type').value = '1H Goals';
  document.getElementById('f_stake').value = '100';
  document.getElementById('f_result').value = 'Pending';
}

loadBets();
</script>
